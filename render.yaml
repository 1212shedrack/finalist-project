# ═══════════════════════════════════════════════════════════════════════════
#  render.yaml  —  Render Blueprint for AmaranthusAI (Sharing cadts-db)
# ═══════════════════════════════════════════════════════════════════════════

services:
  - type: web
    name: amaranthus-ai
    env: python
    region: oregon
    plan: free

    # ── Build ────────────────────────────────────────────────────────────────
    buildCommand: >-
      pip install -r requirements.txt &&
      python manage.py collectstatic --no-input &&
      python manage.py migrate --no-input &&
      python create_admin.py

    # ── Start ────────────────────────────────────────────────────────────────
    startCommand: >-
      gunicorn amaranthus_project.wsgi:application
      --bind 0.0.0.0:$PORT
      --workers 2
      --timeout 120
      --log-level info

    # ── Environment Variables ────────────────────────────────────────────────
    envVars:

      # Default Admin Superuser Credentials
      - key: DJANGO_SUPERUSER_USERNAME
        value: "admin"

      - key: DJANGO_SUPERUSER_EMAIL
        value: "admin@amaranthusai.com"

      - key: DJANGO_SUPERUSER_PASSWORD
        value: "Admin@2026!"

      # Django secret key — Render generates a unique value on first deploy
      - key: SECRET_KEY
        generateValue: true

      # Production mode
      - key: DEBUG
        value: "False"

      # Python version hint
      - key: PYTHON_VERSION
        value: "3.12.3"

      # Suppress TensorFlow oneDNN logging noise
      - key: TF_ENABLE_ONEDNN_OPTS
        value: "0"

      # Django settings module
      - key: DJANGO_SETTINGS_MODULE
        value: "amaranthus_project.settings"

      # Render injects this automatically so ALLOWED_HOSTS picks it up
      - key: RENDER_EXTERNAL_HOSTNAME
        fromService:
          type: web
          name: amaranthus-ai
          property: host
